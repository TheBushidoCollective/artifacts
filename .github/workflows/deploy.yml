name: deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  # Manual runs exist for rollback and for toggling the kill switch, which are
  # the two things you need at 3am and cannot wait for a commit.
  workflow_dispatch:
    inputs:
      kill_switch:
        description: 'Engage the egress kill switch (refuses every mint and publish)'
        type: boolean
        default: false

# One deploy at a time, and never cancel one in flight: a half-applied
# Terraform run is worse than a queued one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: 1.9.8

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production

    steps:
      - uses: actions/checkout@v4

      # No service account key anywhere. The token is minted per run and
      # scoped to this repository by the provider's attribute condition.
      - uses: google-github-actions/auth@v2
        id: auth
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.DEPLOYER_SA }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker ${{ vars.GCP_REGION }}-docker.pkg.dev --quiet

      - name: Build and push
        id: image
        run: |
          set -euo pipefail
          REPO="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/relic/server"
          docker build -f deploy/docker/server/Dockerfile -t "$REPO:${{ github.sha }}" .
          docker push "$REPO:${{ github.sha }}"

          # Deploy by digest, never by tag. A tag can be moved, which makes
          # "what is running" unanswerable during an incident.
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$REPO:${{ github.sha }}")"
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "Deploying $DIGEST"

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        working-directory: deploy/terraform
        run: terraform init -input=false

      - name: Terraform format check
        working-directory: deploy/terraform
        run: terraform fmt -check -recursive

      - name: Terraform plan
        working-directory: deploy/terraform
        run: terraform plan -input=false -out=tfplan
        env:
          TF_VAR_project_id: ${{ vars.GCP_PROJECT_ID }}
          TF_VAR_region: ${{ vars.GCP_REGION }}
          TF_VAR_run_url_infix: ${{ vars.RUN_URL_INFIX }}
          TF_VAR_image: ${{ steps.image.outputs.digest }}
          TF_VAR_kill_switch_engaged: ${{ inputs.kill_switch || false }}
          TF_VAR_operator_tokens: ${{ secrets.RELIC_OPERATOR_TOKENS }}

      - name: Terraform apply
        working-directory: deploy/terraform
        run: terraform apply -input=false -auto-approve tfplan

      - name: Report the deployed origins and DNS delegation
        id: urls
        working-directory: deploy/terraform
        run: |
          set -euo pipefail
          SERVICE="$(terraform output -raw service_url)"
          FETCH="$(terraform output -raw service_run_url)"
          SANDBOX="$(terraform output -raw sandbox_url)"
          DOMAIN="$(terraform output -raw service_domain)"
          NAMESERVERS="$(terraform output -json service_name_servers | jq -r '.[]')"
          DS_RECORD="$(terraform output -raw service_ds_record)"
          CERT="$(terraform output -raw service_certificate)"
          IPV4="$(terraform output -raw service_lb_ipv4)"
          IPV6="$(terraform output -raw service_lb_ipv6)"

          # One origin, and the smoke tests use it. The Cloud Run host no
          # longer accepts internet traffic, so there is nothing to fall back
          # to and nothing that should want to: if the domain does not serve,
          # the deployment is broken and this must say so.
          echo "service=$SERVICE" >> "$GITHUB_OUTPUT"
          echo "run_host=$FETCH" >> "$GITHUB_OUTPUT"
          echo "sandbox=$SANDBOX" >> "$GITHUB_OUTPUT"

          CERT_STATE="$(gcloud compute ssl-certificates describe "$CERT" --global \
            --format='value(managed.status)' 2>/dev/null || echo UNKNOWN)"

          {
            echo "### Relik infrastructure is deployed"
            echo ""
            echo "| Resource | Value |"
            echo "|---|---|"
            echo "| Service origin | $SERVICE |"
            echo "| Cloud Run host | $FETCH |"
            echo "| Sandbox origin | $SANDBOX |"
            echo "| Service domain | $DOMAIN |"
            echo "| Load balancer | $IPV4, $IPV6 |"
            echo "| Certificate | \`$CERT\` ($CERT_STATE) |"
            echo "| Bucket | \`$(terraform output -raw bucket_name)\` |"
            echo ""
            if [ "$CERT_STATE" != "ACTIVE" ]; then
              echo "The certificate is not ACTIVE yet, so $SERVICE does not serve HTTPS."
              echo "Google provisions it once the A and AAAA records resolve. Until then the"
              echo "app is only reachable on the Cloud Run host above."
              echo ""
            fi
            echo "Authoritative nameservers for registrar delegation:"
            echo '```text'
            echo "$NAMESERVERS"
            echo '```'
            echo ""
            echo "DNSSEC DS record (add only after nameserver delegation removes the registrar's old DS):"
            echo '```text'
            echo "$DS_RECORD"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A green apply says Terraform is satisfied. It does not say the service
      # answers. These do.
      - name: Smoke test the deployment
        run: |
          set -euo pipefail
          # The owned domain, through the load balancer. The run.app host is no
          # longer reachable from here, which is the point.
          SERVICE="${{ steps.urls.outputs.service }}"

          echo "health"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 "$SERVICE/health" | tee /dev/stderr | grep -q '"ok"'

          echo "the shell serves and does not leak a referrer"
          curl -fsS -D/tmp/h -o/dev/null "$SERVICE/aaaaaaaaaaaaaaaaaaaaaaaaaa"
          grep -qi '^referrer-policy: no-referrer' /tmp/h

          echo "every asset the shell names resolves"
          for P in /assets/viewer.js /assets/styles.css /assets/register-sw.js /manifest.webmanifest /sw.js /assets/icon.svg; do
            curl -fsS -o/dev/null "$SERVICE$P" || { echo "MISSING $P"; exit 1; }
          done

          echo "the published disclosure is readable before anybody publishes"
          curl -fsS "$SERVICE/policy" | grep -q 'Your browser never sends the'

          echo "the abuse intake answers, because it is a go/no-go obligation"
          curl -fsS "$SERVICE/abuse" | grep -q '<form method="post"'

          echo "a never-issued id is a problem document, not a stack trace"
          curl -sS -o/tmp/b -w '%{http_code}' "$SERVICE/api/relics/aaaaaaaaaaaaaaaaaaaaaaaaaa/mint" -X POST | grep -q 404
          grep -q 'relic_not_found' /tmp/b

      # The two origins have to agree about each other or HTML never renders,
      # and neither side fails loudly on its own: the sandbox returns a healthy
      # 200 to curl while every browser refuses the frame. Assert the pair.
      - name: Smoke test the origin boundary
        run: |
          set -euo pipefail
          ORIGIN="${{ steps.urls.outputs.service }}"
          SERVICE="${{ steps.urls.outputs.service }}"
          SANDBOX="${{ steps.urls.outputs.sandbox }}"
          RUN_HOST="${{ steps.urls.outputs.run_host }}"

          # The retired host must actually be retired. A reachable second
          # origin is a name somebody can be handed that will not render, and
          # nothing else in this pipeline would notice it came back.
          echo "the run.app host no longer answers the internet"
          CODE="$(curl -sS -o/dev/null -m 20 -w '%{http_code}' "$RUN_HOST/health" || echo 000)"
          case "$CODE" in
            200)
              echo "$RUN_HOST still serves; ingress is not restricted"
              exit 1
              ;;
            *)
              echo "  refused with $CODE"
              ;;
          esac

          echo "the sandbox serves its page"
          curl -fsS --retry 10 --retry-all-errors --retry-delay 3 \
            -D/tmp/sh -o/dev/null "$SANDBOX/sandbox.html"

          echo "and names the service origin as the only page allowed to frame it"
          grep -qi "^content-security-policy:.*frame-ancestors $ORIGIN\(;\|\$\)" /tmp/sh || {
            echo "sandbox frame-ancestors does not name $ORIGIN:"
            grep -i '^content-security-policy:' /tmp/sh
            exit 1
          }

          echo "and the service allows exactly that sandbox as a frame source"
          curl -fsS -D/tmp/vh -o/dev/null "$SERVICE/aaaaaaaaaaaaaaaaaaaaaaaaaa"
          grep -qi "^content-security-policy:.*frame-src $SANDBOX\(;\|\$\)" /tmp/vh || {
            echo "service frame-src does not name $SANDBOX:"
            grep -i '^content-security-policy:' /tmp/vh
            exit 1
          }

          echo "and the two are different registrable domains, or there is no boundary"
          test "$(echo "$ORIGIN" | sed 's#https\?://##')" != "$(echo "$SANDBOX" | sed 's#https\?://##')"

          echo "and the sandbox does not sit under the service domain"
          case "$(echo "$SANDBOX" | sed 's#https\?://##')" in
            *".$(echo "$ORIGIN" | sed 's#https\?://##')")
              echo "sandbox shares the service registrable domain; the boundary is gone"
              exit 1
              ;;
          esac

          # The frame has no allow-same-origin, so its document is an opaque
          # origin and every request it makes is cross-origin with Origin:
          # null. A linked module script is fetched with CORS and silently
          # refused, which renders as a blank frame and an empty console. The
          # script has to be inline, and this is the only place that can tell.
          echo "and the sandbox page carries its script inline, fetching nothing"
          curl -fsS "$SANDBOX/sandbox.html" -o /tmp/sandbox.html

          if ! grep -q 'relic:sandbox-ready' /tmp/sandbox.html; then
            echo "sandbox.html does not carry its handler inline; the frame will never render"
            exit 1
          fi

          if grep -qE '<script[^>]+src=' /tmp/sandbox.html; then
            echo "sandbox.html links a script; an opaque-origin document cannot fetch it"
            exit 1
          fi
