name: verify

on:
  push:
    branches: [main]
  pull_request:

# A second push supersedes the first; there is no value in verifying a commit
# nobody will merge.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: jdx/mise-action@v2
        with:
          # The versions in mise.toml, not whatever the runner ships.
          install: true
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      # Builds the viewer first, because the asset tests serve real files out
      # of its dist.
      - name: Test
        run: bun run test
